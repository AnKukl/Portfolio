<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anton Kuklinski · CV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f2efe8; --card:#e8e1d5; --ink:#2b2622; --brown:#8a5a3c; --brown2:#b58b6a; --muted:#6b625a; --dark:#2e2a27; --rule:#d6cbbb;
          --c-lang:#8a5a3c; --c-sci:#6e7c6c; --c-tech:#7d8591; --c-ai:#d6ae84; }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body { background:var(--bg); color:var(--ink); font-family:"Manrope", "Segoe UI", Arial, sans-serif; font-size:15.5px; line-height:1.55; }
  .wrap { max-width:1000px; margin:0 auto; padding:0 26px; }
  .top { display:flex; justify-content:space-between; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); padding:22px 0 0; }
  .hero { display:grid; grid-template-columns: 1fr 260px; gap:40px; align-items:start; padding:36px 0 26px; }
  h1 { margin:0; font-weight:800; font-size:clamp(44px, 7vw, 76px); line-height:.95; letter-spacing:-.02em; text-transform:uppercase; }
  h1 span { display:block; }
  h1 .b { color:var(--brown); }
  .tag { font-size:18px; font-weight:600; margin:22px 0 0; max-width:34ch; }
  .about { color:#4d4640; margin:14px 0 0; max-width:62ch; }
  .photo { position:relative; }
  .photo img { display:block; width:100%; aspect-ratio:4/5; object-fit:cover; border-radius:6px; box-shadow:10px 10px 0 var(--brown2); }
  .meta { display:grid; grid-template-columns: repeat(5, 1fr); gap:18px; border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); padding:18px 0; margin-bottom:34px; }
  .meta small { display:block; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
  .meta b { font-weight:700; font-size:14.5px; }
  .meta a { color:var(--brown); font-weight:700; text-decoration-thickness:2px; }

  .panel { background:var(--dark); color:#efe7dc; border-radius:18px; padding:26px 26px 22px; margin-bottom:34px; }
  .panel h2 { color:#fff; margin:0 0 4px; font-size:22px; letter-spacing:.01em; }
  .panel .sub { color:#cbbfae; font-size:14px; margin:0 0 6px; }
  .legend { display:flex; flex-wrap:wrap; gap:4px 16px; font-size:12.5px; color:#d8ccbb; margin:8px 0 0; }
  .legend i { display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
  svg.chart { display:block; width:100%; height:auto; }
  .pk { cursor:pointer; outline:none; }
  .pk .body { transition:opacity .15s; }
  .chart.has-active .pk:not(.on) .body, .chart.has-active .pk:not(.on) .lbl { opacity:.3; }
  .pk.on .halo { opacity:1; }
  .halo { opacity:0; transition:opacity .15s; }
  .info { margin-top:12px; background:rgba(255,255,255,.06); border-left:4px solid var(--c-ai); border-radius:0 10px 10px 0; padding:12px 16px; min-height:88px; }
  .info b { font-size:16px; }
  .info .lv { display:inline-block; margin-left:8px; font-size:12px; font-weight:800; background:var(--c-ai); color:#2b2622; padding:2px 9px; border-radius:999px; vertical-align:2px; }
  .info p { margin:6px 0 0; color:#e6dccd; font-size:14.5px; }
  .info .hint { color:#bfb29f; margin:0; }

  .block { margin-bottom:40px; }
  .block h2 { font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--brown); margin:0 0 14px; display:flex; align-items:center; gap:10px; }
  .block h2::before { content:""; width:24px; height:8px; background:var(--brown2); border-radius:8px; }
  .cols { display:grid; grid-template-columns: 1.35fr 1fr; gap:40px; }
  .item { margin-bottom:18px; }
  .item .ih { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .item .ih span { color:var(--muted); font-size:13.5px; }
  .item .io { color:var(--muted); font-size:14px; }
  .item ul { margin:8px 0 0; padding-left:20px; }
  .item li { margin-bottom:5px; color:#3f3832; }
  .tiles { display:grid; grid-template-columns: repeat(2, 1fr); gap:12px; }
  .tile { background:var(--card); border-radius:12px; padding:14px 16px; font-size:14px; transition:transform .14s, background .14s; }
  .tile:hover { transform:translateY(-3px); background:#ddd3c3; }
  .tile b { color:var(--brown); display:block; font-size:12px; letter-spacing:.1em; text-transform:uppercase; margin-bottom:4px; }
  .row { display:flex; justify-content:space-between; border-bottom:1px solid var(--rule); padding:7px 0; }
  .row b { color:var(--brown); }
  .contact a { color:var(--brown); font-weight:700; }
  .foot { font-size:12.5px; color:var(--muted); padding:14px 0 40px; border-top:1px solid var(--rule); display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; }
  .ai-list { list-style:none; padding:0; margin:0; counter-reset:n; }
  .ai-list li { counter-increment:n; position:relative; padding-left:34px; margin-bottom:10px; }
  .ai-list li::before { content:counter(n, decimal-leading-zero); position:absolute; left:0; top:0; color:var(--brown); font-weight:800; }

  .lang-sw button { font:inherit; font-size:11px; letter-spacing:.14em; background:none; border:1px solid var(--rule); color:var(--muted); padding:4px 10px; border-radius:999px; cursor:pointer; margin-left:4px; }
  .lang-sw button.on, .lang-sw button:hover { background:var(--brown); border-color:var(--brown); color:#fff; }
  .rv { opacity:0; transform:translateY(14px); transition:opacity .6s ease, transform .6s ease; }
  .rv.in { opacity:1; transform:none; }

  @media (max-width: 820px) {
    .hero { grid-template-columns: 1fr; }
    .photo { max-width:240px; }
    .meta { grid-template-columns: repeat(2, 1fr); }
    .cols { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { .rv { opacity:1; transform:none; transition:none; } }
</style>
</head>

  $("availT").textContent = t.availT; $("avail").textContent = t.avail;
  $("skillsT").textContent = t.skillsT;
  $("skills").innerHTML = t.skills.map(function (s) { return "<div class='tile'><b>" + s[0] + "</b>" + s[1] + "</div>"; }).join("");
  $("refs").textContent = t.refs;
  $("aiT").textContent = t.aiT;
  $("ai").innerHTML = "<ol class='ai-list'>" + t.ai.map(function (x) { return "<li>" + x + "</li>"; }).join("") + "</ol>";
  $("howT").textContent = t.howT;
  $("how").innerHTML = t.how.map(function (h) { return "<div class='tile'><b>" + h[0] + "</b>" + h[1] + "</div>"; }).join("");

  // skill profile
  var svg = $("chart"), info = $("info"), active = -1;
  var BASE = 250, MAXH = 170, W = 26;
  function wrapWords(s, max) {
    var words = s.split(" "), lines = [], cur = "";
    words.forEach(function (w) {
      if ((cur + " " + w).trim().length > max && cur) { lines.push(cur); cur = w; }
      else { cur = (cur + " " + w).trim(); }
    });
    if (cur) lines.push(cur);
    return lines;
  }
  var colors = { lang: "var(--c-lang)", sci: "var(--c-sci)", tech: "var(--c-tech)", ai: "var(--c-ai)" };

  function showInfo(i) {
    var p = t.peaks[i];
    info.innerHTML = "<b></b><span class='lv'></span><p></p>";
    info.querySelector("b").textContent = p.n;
    info.querySelector(".lv").textContent = p.l;
    info.querySelector("p").textContent = p.d;
  }
  function showHint() { info.innerHTML = "<p class='hint'></p>"; info.querySelector("p").textContent = t.hint; }
  function setActive(i) {
    active = i;
    svg.classList.toggle("has-active", i >= 0);
    svg.querySelectorAll(".pk").forEach(function (g, k) { g.classList.toggle("on", k === i); });
    if (i >= 0) showInfo(i); else showHint();
  }

  function drawChart() {
    var n = t.peaks.length, out = "";
    out += "<line x1='20' y1='" + BASE + "' x2='980' y2='" + BASE + "' stroke='#5a4e42' stroke-width='1.2'/>";
    [1, 2, 3].forEach(function (g) {
      var gy = BASE - g * (MAXH / 3.2);
      out += "<line x1='20' y1='" + gy + "' x2='980' y2='" + gy + "' stroke='#3c332c' stroke-width='1'/>";
    });
    out += "<text x='20' y='" + (BASE - MAXH * 0.95 - 10) + "' fill='#bfb29f' font-size='10' letter-spacing='1.5'>" + t.lvl[0] + "</text>";
    out += "<text x='20' y='" + (BASE - MAXH * 0.55 - 10) + "' fill='#bfb29f' font-size='10' letter-spacing='1.5'>" + t.lvl[1] + "</text>";
    out += "<text x='20' y='" + (BASE - MAXH * 0.2 - 10) + "' fill='#bfb29f' font-size='10' letter-spacing='1.5'>" + t.lvl[2] + "</text>";
    t.peaks.forEach(function (p, i) {
      var x = 200 + i * (780 / (n - 1)), top = BASE - p.h * MAXH, col = colors[p.g];
      var nl = wrapWords(p.n, 13), lt = top - 26 - 13 * (nl.length - 1);
      var labelSvg = nl.map(function (ln, k) {
        return "<text x='" + x + "' y='" + (lt + 13 * k) + "' fill='#ffffff' font-size='12' font-weight='800' text-anchor='middle'>" + ln + "</text>";
      }).join("") + "<text x='" + x + "' y='" + (top - 9) + "' fill='" + col + "' font-size='11' font-weight='700' text-anchor='middle'>" + p.l + "</text>";
      var path = "M" + (x - W) + "," + BASE + " C" + (x - W * 0.45) + "," + BASE + " " + (x - W * 0.38) + "," + top + " " + x + "," + top +
                 " C" + (x + W * 0.38) + "," + top + " " + (x + W * 0.45) + "," + BASE + " " + (x + W) + "," + BASE;
      out += "<g class='pk' data-k='" + i + "' tabindex='0' role='button' aria-label='" + p.n + "'>" +
        "<rect class='halo' x='" + (x - W - 8) + "' y='" + (lt - 14) + "' width='" + (2 * W + 16) + "' height='" + (BASE - lt + 18) + "' rx='10' fill='none' stroke='#fff' stroke-width='1.5'/>" +
        "<g class='body'><path d='" + path + " Z' fill='" + col + "' fill-opacity='0.35'/><path d='" + path + "' fill='none' stroke='" + col + "' stroke-width='2.2'/></g>" +
        "<g class='lbl'>" + labelSvg + "</g></g>";
    });
    svg.innerHTML = out;
    svg.querySelectorAll(".pk").forEach(function (g, i) {
      g.addEventListener("mouseenter", function () { setActive(i); });
      g.addEventListener("focus", function () { setActive(i); });
      g.addEventListener("click", function () { setActive(i); });
    });
    svg.classList.toggle("has-active", active >= 0);
    if (active >= 0) showInfo(active); else showHint();
  }
  svg.addEventListener("mouseleave", function () { setActive(-1); });
  drawChart();

  }
  renderAll();
  window.setLang = function (l) {
    LANG = l; renderAll();
    document.querySelectorAll("[data-l]").forEach(function (b) { b.classList.toggle("on", b.getAttribute("data-l") === l); });
  };
  // reveal on scroll
  var rv = document.querySelectorAll(".rv");
  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }); }, { threshold: 0.12 });
    rv.forEach(function (el) { io.observe(el); });
  } else { rv.forEach(function (el) { el.classList.add("in"); }); }
})();
</script>
</body>
</html>

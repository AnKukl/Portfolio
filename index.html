  var t = D[LANG];

    return list.map(function (e) {

  $("projT").textContent = t.projT; $("proj").innerHTML = entries(t.proj);
  $("otherT").textContent = t.otherT; $("other").textContent = t.other;

  $("langT").textContent = t.langT; $("langs").innerHTML = t.langs.map(function (l) { return "<div class='row'><span>" + l[0] + "</span><b>" + l[1] + "</b></div>"; }).join("");

  $("availT").textContent = t.availT; $("avail").textContent = t.avail;
  $("skillsT").textContent = t.skillsT;

  // skill profile

  var BASE = 250, MAXH = 170, W = 26;
  function wrapWords(s, max) {
    var words = s.split(" "), lines = [], cur = "";
    words.forEach(function (w) {
      if ((cur + " " + w).trim().length > max && cur) { lines.push(cur); cur = w; }
      else { cur = (cur + " " + w).trim(); }
    });
    if (cur) lines.push(cur);
    return lines;
  }
  var colors = { lang: "var(--c-lang)", sci: "var(--c-sci)", tech: "var(--c-tech)", ai: "var(--c-ai)" };

  function setActive(i) {
    active = i;

  function drawChart() {
    var n = t.peaks.length, out = "";

      var x = 200 + i * (780 / (n - 1)), top = BASE - p.h * MAXH, col = colors[p.g];

        return "<text x='" + x + "' y='" + (lt + 13 * k) + "' fill='#ffffff' font-size='12' font-weight='800' text-anchor='middle'>" + ln + "</text>";

                 " C" + (x + W * 0.38) + "," + top + " " + (x + W * 0.45) + "," + BASE + " " + (x + W) + "," + BASE;
      out += "<g class='pk' data-k='" + i + "' tabindex='0' role='button' aria-label='" + p.n + "'>" +

        "<g class='lbl'>" + labelSvg + "</g></g>";
    });
    svg.innerHTML = out;
    svg.querySelectorAll(".pk").forEach(function (g, i) {
      g.addEventListener("mouseenter", function () { setActive(i); });

      g.addEventListener("click", function () { setActive(i); });
    });
    svg.classList.toggle("has-active", active >= 0);
    if (active >= 0) showInfo(active); else showHint();
  }
  svg.addEventListener("mouseleave", function () { setActive(-1); });

  var rv = document.querySelectorAll(".rv");
  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }); }, { threshold: 0.12 });
    rv.forEach(function (el) { io.observe(el); });
  } else { rv.forEach(function (el) { el.classList.add("in"); }); }
